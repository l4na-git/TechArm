name: Deploy to Home Server via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Validate required secrets
        run: |
          TAILSCALE_OAUTH_CLIENT_ID="${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}"
          TAILSCALE_OAUTH_SECRET="${{ secrets.TAILSCALE_OAUTH_SECRET }}"
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ENV_OLLAMA_BASE_URL="${{ secrets.ENV_OLLAMA_BASE_URL }}"
          ENV_OLLAMA_MODEL="${{ secrets.ENV_OLLAMA_MODEL }}"
          ENV_VOICEVOX_BASE_URL="${{ secrets.ENV_VOICEVOX_BASE_URL }}"
          ENV_VISION_OFFLOAD_URL="${{ secrets.ENV_VISION_OFFLOAD_URL }}"
          ENV_CONTROL_PANEL_URL="${{ secrets.ENV_CONTROL_PANEL_URL }}"
          ENV_SO101_PORT="${{ secrets.ENV_SO101_PORT }}"
          required=(
            TAILSCALE_OAUTH_CLIENT_ID
            TAILSCALE_OAUTH_SECRET
            DEPLOY_USER
            DEPLOY_HOST
            DEPLOY_PATH
            ENV_OLLAMA_BASE_URL
            ENV_OLLAMA_MODEL
            ENV_VOICEVOX_BASE_URL
            ENV_VISION_OFFLOAD_URL
            ENV_CONTROL_PANEL_URL
            ENV_SO101_PORT
          )
          missing=0
          for key in "${required[@]}"; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create .env file from example and secrets
        run: |
          # ベースファイルをコピー
          cp .env.example .env
          
          # GitHub Secretsから機密情報を追加
          cat << 'EOF' >> .env
          
          # =============================================================================
          # 以下の機密情報はGitHub Secretsから自動挿入されます
          # =============================================================================
          
          # --- LLM (Ollama/DeepSeek) ---
          OLLAMA_BASE_URL=${{ secrets.ENV_OLLAMA_BASE_URL }}
          OLLAMA_MODEL=${{ secrets.ENV_OLLAMA_MODEL }}
          
          # --- VOICEVOX Engine (self-hosted, via Tailscale) ---
          VOICEVOX_BASE_URL=${{ secrets.ENV_VOICEVOX_BASE_URL }}
          
          # --- Vision Offload (optional, via Tailscale) ---
          VISION_OFFLOAD_URL=${{ secrets.ENV_VISION_OFFLOAD_URL }}
          
          # --- Control Panel (Tailscale only) ---
          CONTROL_PANEL_URL=${{ secrets.ENV_CONTROL_PANEL_URL }}
          
          # --- SO-101 Robot Arm ---
          SO101_PORT=${{ secrets.ENV_SO101_PORT }}
          EOF

      - name: Deploy to server
        run: |
          # Fail fast if DEPLOY_PATH looks unsafe.
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "DEPLOY_PATH is empty" >&2
            exit 1
          fi
          if [[ "${{ secrets.DEPLOY_PATH }}" != /* ]]; then
            echo "DEPLOY_PATH must be an absolute path: ${{ secrets.DEPLOY_PATH }}" >&2
            exit 1
          fi
          if [ "${{ secrets.DEPLOY_PATH }}" = "/" ]; then
            echo "DEPLOY_PATH must not be /" >&2
            exit 1
          fi
          rsync -avz --delete \
            -e "tailscale ssh" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.mypy_cache' \
            --exclude '.DS_Store' \
            --exclude 'cache' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Run deployment script on server
        run: |
          tailscale ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/deploy.sh"
